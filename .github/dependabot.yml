version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "15:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "15:15"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    labels:
      - dependencies
